upstream datatracker_backend {
    server 127.0.0.1:8001;
# Uncomment when changing to nginx 1.29.7 or later. 
#     keepalive 0; # default = 32 since nginx 1.29.7
}

server {
    listen 8000 default_server;
    listen [::]:8000 default_server;

    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    client_max_body_size 12m;
    
    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;

    server_name _;

    location /_static/ {
        proxy_pass http://static/;
    }

    location = /pgadmin { return 302 /pgadmin/; }

    location /admin/ {
        client_max_body_size 128m;
        proxy_pass http://datatracker_backend;
        proxy_set_header Host localhost:8000;
    }

    location /pgadmin/ {
        # Local pgAdmin uses its own accounts, independent of tracker accounts.
        proxy_pass http://pgadmin:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header X-Scheme $scheme;
    }

    location / {
        error_page 502 /502.html;
        proxy_pass http://datatracker_backend/;
        proxy_set_header Host localhost:8000;
    }

    location /502.html {
        root /var/www/html;
        internal;
    }
}

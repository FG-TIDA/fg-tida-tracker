{% load fgtida %}<span class="d-inline-flex flex-wrap gap-2 float-end" aria-label="Session resources">
{% for doc in session.public_materials %}<a class="btn btn-sm btn-outline-primary" href="{% url 'fgtida:document' doc.name %}" title="{{ doc.title }}" aria-label="{{ doc.title }}"><i class="bi bi-{% if doc.type_id == 'recording' %}camera-video{% elif doc.type_id == 'minutes' %}chat-left-text{% elif doc.type_id == 'agenda' %}list-columns{% else %}file-earmark-text{% endif %}" aria-hidden="true"></i></a>{% endfor %}
{% for resource in session.tida_resources.all %}{% if resource.kind != 'login' or session.current_status != 'canceled' and session.current_status != 'canceledpa' %}<a class="btn btn-sm btn-outline-{% if resource.kind == 'notes' %}success{% elif resource.kind == 'login' %}danger{% else %}primary{% endif %}" href="{{ resource.resource_url }}" title="{{ resource.title }}" aria-label="{{ resource.get_kind_display }}: {{ resource.title }}" rel="noopener noreferrer"><i class="bi bi-{{ resource.icon }}" aria-hidden="true"></i></a>{% endif %}{% endfor %}</span>

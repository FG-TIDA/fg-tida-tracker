name: fgtida-production
x-app: &app
  image: fgtida-production:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  env_file: production.env
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  volumes: [assets:/data]
  secrets: [django_key, db_password]
  networks: [backend, frontend]
services:
  app:
    <<: *app
    depends_on:
      db: {condition: service_healthy}
      cache: {condition: service_started}
      queue: {condition: service_started}
  worker:
    <<: *app
    command: [celery, -A, ietf, worker, --loglevel=INFO, --concurrency=2]
    depends_on:
      db: {condition: service_healthy}
      queue: {condition: service_started}
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fgtida
      POSTGRES_USER: fgtida_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets: [db_password, db_owner_password]
    volumes:
      - database:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-fgtida.sql:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fgtida -d fgtida]
      interval: 10s
      timeout: 5s
      retries: 10
  cache:
    image: memcached:1.6-alpine
    restart: unless-stopped
    command: [memcached, -m, '128', -U, '0']
    networks: [backend]
  queue:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes: [queue:/data]
    networks: [backend]
  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    env_file: production.env
    command:
      - /bin/sh
      - -ec
      - 'test -n "$$FGTIDA_TRUSTED_PROXY_CIDR"; envsubst ''$$FGTIDA_TRUSTED_PROXY_CIDR'' < /etc/nginx/fgtida.conf.template > /etc/nginx/nginx.conf; exec nginx -g ''daemon off;'''
    ports: ['127.0.0.1:8080:8080']
    volumes:
      - ./nginx.conf:/etc/nginx/fgtida.conf.template:ro
      - assets:/data:ro
    depends_on: [app]
    networks: [frontend]
volumes:
  database:
  assets:
  queue:
networks:
  backend: {internal: true}
  frontend:
secrets:
  django_key: {file: ./secrets/django_key}
  db_password: {file: ./secrets/db_password}
  db_owner_password: {file: ./secrets/db_owner_password}

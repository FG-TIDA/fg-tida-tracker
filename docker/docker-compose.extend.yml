services:
    app:
        ports:
            - '127.0.0.1:CUSTOM_PORT:8000'
            - '127.0.0.1:3000:3000'
        volumes:
            - .:/workspace
            - /workspace/.parcel-cache
            - /workspace/__pycache__
            - /workspace/.vite
            - /workspace/.yarn/unplugged
            - app-assets:/assets
    db:
        ports:
            - '127.0.0.1::5432'
    pgadmin:
        ports:
            - '127.0.0.1::5433'
    blobstore:
        ports:
            - '127.0.0.1:9000:9000'
            - '127.0.0.1:9001:9001'
    celery:
        volumes:
            - .:/workspace
            - app-assets:/assets

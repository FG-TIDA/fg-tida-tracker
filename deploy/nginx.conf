worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    map $uri $safe_path {
        ~^/accounts/ /accounts/redacted;
        default $uri;
    }
    log_format safe_access '$remote_addr [$time_local] "$request_method $safe_path" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log safe_access;
    set_real_ip_from ${FGTIDA_TRUSTED_PROXY_CIDR};
    real_ip_header X-Real-IP;
    limit_req_zone $binary_remote_addr zone=accounts:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=public:10m rate=10r/s;
    limit_req_status 429;
    upstream tracker { server app:8000; }
    server {
        listen 8080;
        client_max_body_size 12m;
        client_body_timeout 15s;
        send_timeout 30s;
        # Bind this listener to loopback behind the hosting provider's TLS proxy.
        # That proxy must preserve Host and overwrite X-Real-IP with the client IP.
        location /static/ { alias /data/static/; autoindex off; }
        location /media/ { return 404; }
        location /pgadmin/ { return 404; }
        location /admin/ {
            client_max_body_size 128m;
            proxy_pass http://tracker;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 120s;
        }
        location ~ ^/(accounts|admin/login|submit)/ {
            limit_req zone=accounts burst=10 nodelay;
            proxy_pass http://tracker;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 45s;
        }
        location / {
            limit_req zone=public burst=30 nodelay;
            proxy_pass http://tracker;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 45s;
        }
    }
}
